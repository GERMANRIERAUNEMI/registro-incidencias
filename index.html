<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Incidencias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Sistema de Registro de Incidencias</h1>
    <p class="version">Versión 1.0.0</p>
  </header>

  <main>
    <section class="card">
      <h2>Registrar incidencia</h2>
      <form id="form-incidencia">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" required></textarea>

        <label for="prioridad">Prioridad</label>
        <select id="prioridad">
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
        </select>

        <label for="estado">Estado</label>
        <select id="estado">
          <option value="Abierta">Abierta</option>
          <option value="En proceso">En proceso</option>
          <option value="Cerrada">Cerrada</option>
        </select>

        <button type="submit">Registrar</button>
      </form>
    </section>

    <section class="card">
      <h2>Listado de incidencias</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tabla-incidencias"></tbody>
      </table>
      <p id="sin-datos">No hay incidencias registradas.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
